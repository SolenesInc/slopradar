[package]
name = "slopradar-oxc"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
oxc_allocator = "=0.149.0"
oxc_ast = "=0.149.0"
oxc_ast_visit = "=0.149.0"
oxc_parser = "=0.149.0"
oxc_span = "=0.149.0"
oxc_syntax = "=0.149.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
strip = true
lto = "thin"
